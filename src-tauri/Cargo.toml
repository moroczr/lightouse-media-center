[package]
name = "lighthouse-media-center"
version = "0.1.0"
description = "A desktop presentation studio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.21"
dunce = "1"
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSGraphics", "NSScreen", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSValue"] }
