name: Windows desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup update stable
      - run: rustup default stable
      - run: npm ci
      - run: npm test
      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis
      - name: Run native Rust tests
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Install desktop test dependencies
        run: python -m pip install playwright==1.56.0 pywinauto==0.6.9 imageio-ffmpeg==0.6.0
      - name: Install and exercise Studio and Kiosk
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'LighthouseTest'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          $installer = Start-Process $installers[0].FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer exited with $($installer.ExitCode)" }
          python tests/windows/presentation.py "$installDir/lighthouse-media-center.exe"
      - name: Upload WebView2 trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-presentation-trace
          path: windows-presentation-trace.zip
          if-no-files-found: ignore
